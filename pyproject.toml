[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "microtabiclv2"
version = "0.1.0"
description = "A one-file educational implementation of TabICLv2"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [{ name = "microTabICLv2 contributors" }]
dependencies = [
    "numpy>=1.24,<2",
    "scikit-learn>=1.3",
    "torch==2.2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch>=2.3,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]

[project.optional-dependencies]
dev = [
    "matplotlib>=3.8",
    "pytest>=8",
    "ruff>=0.9",
]
modal = ["modal>=1.1"]

[tool.hatch.build.targets.wheel]
only-include = ["microtabiclv2.py"]

[tool.pytest.ini_options]
testpaths = ["test_microtabiclv2.py"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
